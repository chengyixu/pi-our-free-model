<text x="1390" y="229" font-size="15" fill="#b9c7b9">pi / terminal</text>
<text x="108" y="278" font-family="Menlo, monospace" font-size="23" fill="#d9edb2">$ pi install git:github.com/chengyixu/pi-our-free-model</text><text x="108" y="320" font-family="Menlo, monospace" font-size="23" fill="#f7f6ee"></text><text x="108" y="362" font-family="Menlo, monospace" font-size="23" fill="#d9edb2">/free-models</text><text x="108" y="404" font-family="Menlo, monospace" font-size="23" fill="#f7f6ee">  Our Free Model · public pool (prompts may be logged)</text><text x="108" y="446" font-family="Menlo, monospace" font-size="23" fill="#d9edb2">  › Laguna XS 2.1 — ofm-kilo/poolside/laguna-xs-2.1:free</text><text x="108" y="488" font-family="Menlo, monospace" font-size="23" fill="#b9c7b9">    Nemotron 3.5 Lightning · Step 5 Preview · and more</text><text x="108" y="530" font-family="Menlo, monospace" font-size="23" fill="#f7f6ee"></text><text x="108" y="572" font-family="Menlo, monospace" font-size="23" fill="#d9edb2">/thinking → off / low / medium / high</text><text x="108" y="614" font-family="Menlo, monospace" font-size="23" fill="#f7f6ee"></text><text x="108" y="656" font-family="Menlo, monospace" font-size="23" fill="#f7f6ee">&gt; Reply with exactly PI_NATIVE_OK</text><text x="108" y="698" font-family="Menlo, monospace" font-size="23" fill="#d9edb2">PI_NATIVE_OK</text><text x="108" y="740" font-family="Menlo, monospace" font-size="23" fill="#f7f6ee"></text><text x="108" y="782" font-family="Menlo, monospace" font-size="23" fill="#b9c7b9">/session → Pi tracks token usage and cost</text>
<text x="70" y="922" font-size="19" fill="#486458">Prompts go directly to Kilo. Public free pools are not for secrets or production workloads.</text></g></svg>